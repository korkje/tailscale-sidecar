version: "3.9"
name: qbittorrent-tailscale
services:
  qbittorrent:
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: service:tailscale
    environment:
      - PUID=1026
      - PGID=100
      - TZ=${QBT_TZ}
    volumes:
      - ./qbittorrent/config:/config
      - ${QBT_MEDIA}:/media
  firefox:
    image: jlesage/firefox
    container_name: firefox
    restart: unless-stopped
    network_mode: service:tailscale
    shm_size: "2gb"
    environment:
      - USER_ID=1026
      - GROUP_ID=100
      - TZ=${QBT_TZ}
      - FF_PREF_PRIVATE=browser.privatebrowsing.autostart=true
      - FF_PREF_THEME=extensions.activeThemeID="firefox-compact-dark@mozilla.org"
      - FF_PREF_DARK_UI=ui.systemUsesDarkTheme=1
      - FF_PREF_DARK_CONTENT=layout.css.prefers-color-scheme.content-override=0
      - FF_PREF_NO_FXA=identity.fxaccounts.enabled=false
      - FF_PREF_NO_WELCOME=browser.aboutwelcome.enabled=false
      - FF_PREF_NO_WHATSNEW=browser.startup.homepage_override.mstone="ignore"
      - FF_PREF_NO_DEFAULT_CHECK=browser.shell.checkDefaultBrowser=false
      - FF_PREF_NEWTAB_NO_SPONSORED=browser.newtabpage.activity-stream.showSponsored=false
      - FF_PREF_NEWTAB_NO_SPONSORED_SITES=browser.newtabpage.activity-stream.showSponsoredTopSites=false
      - FF_PREF_NEWTAB_NO_STORIES=browser.newtabpage.activity-stream.feeds.section.topstories=false
    volumes:
      - ./firefox/config:/config
  tailscale:
    image: tailscale/tailscale:stable
    container_name: tailscale
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=true
      - TS_EXTRA_ARGS=--exit-node=${TS_EXIT}
      - TS_TAILSCALED_EXTRA_ARGS=--port=41642
    ports:
      - "41642:41642/udp"
    cap_add:
      - net_admin
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
